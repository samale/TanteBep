<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanteBep078 | GLITCH Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-pink: #ff0055;
            --neon-blue: #00f7ff;
            --dark-bg: #0a0a0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Space Mono', monospace;
            overflow-x: hidden;
        }

        /* Scanline / CRT Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        /* Navigatie */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            border-bottom: 2px solid var(--neon-pink);
            background: rgba(0,0,0,0.9);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--neon-blue);
            text-shadow: 2px 2px var(--neon-pink);
            animation: glitch 1s infinite;
        }

        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 20px; }
        nav ul li a { 
            text-decoration: none; 
            color: var(--neon-green); 
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        /* Glitch Animatie */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); text-shadow: -2px -2px var(--neon-pink); }
            40% { transform: translate(-3px, -3px); text-shadow: 2px 2px var(--neon-blue); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }

        /* Hero */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        }

        .glitch-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            position: relative;
            color: white;
        }

        /* Flashy Button */
        .btn-glitch {
            margin-top: 30px;
            padding: 15px 30px;
            background: none;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            cursor: pointer;
            font-family: 'Orbitron';
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-glitch:hover {
            background: var(--neon-green);
            color: black;
            box-shadow: 0 0 20px var(--neon-green);
        }

        /* Image Overlay (Modal) */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .overlay img {
            max-width: 80%;
            max-height: 80%;
            border: 5px solid white;
            box-shadow: 0 0 50px var(--neon-pink);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0); filter: hue-rotate(90deg); }
            to { transform: scale(1); filter: hue-rotate(0deg); }
        }

        .close-btn {
            margin-top: 20px;
            color: var(--neon-pink);
            cursor: pointer;
            font-size: 1.5rem;
        }

        /* Secties */
        section { padding: 80px 10%; }
        h2 { color: var(--neon-pink); margin-bottom: 20px; text-transform: uppercase; }

    </style>
</head>
<body>

    <nav>
        <div class="logo">TanteBep078</div>
        <ul>
            <li><a href="#webshop">Webshop</a></li>
            <li><a href="#bewijs">Bewijs</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <div class="hero">
        <h1 class="glitch-text" data-text="TanteBep078">TanteBep078</h1>
        <p>DE ESTHETIEK VAN DE 078 ONDERGROND</p>
        <button class="btn-glitch" onclick="openImage()">BEKIJK HET BEWIJS (1.PNG)</button>
    </div>

    <div id="imageOverlay" class="overlay">
        <img src="images/1.png" alt="Exclusief Bewijs">
        <div class="close-btn" onclick="closeImage()">[ SLUITEN ]</div>
    </div>

    <section id="webshop">
        <h2>Webshop</h2>
        <p>> Systeem geladen... Selecteer producten...</p>
        </section>

    <section id="bewijs">
        <h2>Bewijs</h2>
        <p>> Alle transacties geverifieerd in de 078-database.</p>
    </section>

    <script>
        function openImage() {
            document.getElementById('imageOverlay').style.display = 'flex';
            // Optioneel: voeg een glitch geluidje toe of console log voor "hack" effect
            console.log("Toegang verleend tot images/1.png...");
        }

        function closeImage() {
            document.getElementById('imageOverlay').style.display = 'none';
        }

        // Extra spice: laat de tekst random trillen
        setInterval(() => {
            const logo = document.querySelector('.logo');
            logo.style.left = (Math.random() * 4 - 2) + 'px';
        }, 50);
    </script>

</body>
</html>
