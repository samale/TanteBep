<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanteBep078 | Premium Glitch</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff;
            --glitch-red: #ff003c;
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Modern Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #aaa;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .nav-links a:hover { color: #fff; text-shadow: 0 0 10px var(--accent); }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 10%;
            text-align: center;
        }

        .hero h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(2rem, 8vw, 5rem);
            margin-bottom: 1rem;
            position: relative;
        }

        /* Modern Glitch Effect */
        .hero h1::before, .hero h1::after {
            content: "TanteBep078";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.8;
        }

        .hero h1:hover::before {
            color: var(--glitch-red);
            animation: glitch-anim 0.2s infinite;
            z-index: -1;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(-5px, -5px); }
            100% { transform: translate(5px, 5px); }
        }

        /* Button & Interactions */
        .cta-container {
            margin-top: 2rem;
        }

        .main-btn {
            padding: 1rem 2.5rem;
            background: #fff;
            color: #000;
            border: none;
            font-family: 'Syncopate';
            font-weight: 700;
            cursor: pointer;
            transition: 0.4s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
        }

        .main-btn:hover {
            background: var(--accent);
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--accent);
        }

        /* Image Viewer (Modal) */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            max-width: 100%;
            max-height: 80vh;
            border: 1px solid var(--accent);
            transform: scale(0.8);
            transition: 0.3s;
        }

        .modal.active { display: flex; }
        .modal.active .modal-content { transform: scale(1); }

        .close-modal {
            position: absolute;
            top: 30px;
            right: 30px;
            font-family: 'Syncopate';
            cursor: pointer;
            color: var(--glitch-red);
        }

        /* Mobile Friendly Grid */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 5% 10%;
        }

        .glass-card {
            background: var(--card-bg);
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            transition: 0.3s;
        }

        .glass-card:hover {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.07);
        }

        /* Responsiveness voor kleine schermen */
        @media (max-width: 600px) {
            .nav-links { display: none; } /* Simpel voor nu: verberg links op mobile */
            .hero { padding: 0 5%; }
            .main-btn { width: 100%; clip-path: none; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">TB078</div>
        <div class="nav-links">
            <a href="#shop">Webshop</a>
            <a href="#proof">Bewijs</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <main class="hero">
        <h1>TanteBep078</h1>
        <p style="color: #666; letter-spacing: 3px;">PREMIUM QUALITY // 078 AREA</p>
        
        <div class="cta-container">
            <button class="main-btn" onclick="toggleModal(true)">OPEN 1.PNG</button>
        </div>
    </main>

    <section id="proof" class="content-grid">
        <div class="glass-card">
            <h3 style="color: var(--accent)">STATUS</h3>
            <p>Systeem is online. Alle leveringen zijn geverifieerd.</p>
        </div>
        <div class="glass-card">
            <h3 style="color: var(--glitch-red)">EXCLUSIEF</h3>
            <p>Alleen voor degenen die kwaliteit herkennen.</p>
        </div>
    </section>

    <div id="imageModal" class="modal">
        <span class="close-modal" onclick="toggleModal(false)">[ SLUIT ]</span>
        <img src="images/1.png" alt="Bewijs" class="modal-content">
    </div>

    <script>
        function toggleModal(show) {
            const modal = document.getElementById('imageModal');
            if (show) {
                modal.classList.add('active');
                document.body.style.overflow = 'hidden'; // Stop scrollen
            } else {
                modal.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }

        // Glitch mouse follow effect (optioneel)
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.querySelector('.hero h1').style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    </script>
</body>
</html>
