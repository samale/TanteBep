<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanteBep078 | Contact Secure Uplink</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;500&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff;
            --glitch-red: #ff003c;
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow: hidden; /* Clean for landing */
            height: 100vh;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
            text-decoration: none;
        }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a {
            text-decoration: none;
            color: #aaa;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .nav-links a:hover { color: #fff; text-shadow: 0 0 10px var(--accent); }

        /* Contact Wrapper */
        .contact-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 10%;
            text-align: center;
            background: radial-gradient(circle at center, #0a1112 0%, #050505 100%);
        }

        .hero h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 0.5rem;
            letter-spacing: 10px;
        }

        .status-line {
            font-family: 'Space Mono', monospace;
            color: var(--accent);
            font-size: 0.9rem;
            margin-bottom: 3rem;
            text-transform: uppercase;
        }

        /* Glitch Email Card */
        .email-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            position: relative;
            max-width: 600px;
            width: 100%;
            backdrop-filter: blur(10px);
            transition: 0.4s;
            cursor: pointer;
        }

        .email-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--accent), transparent, var(--glitch-red));
            z-index: -1;
            opacity: 0.2;
        }

        .email-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.1);
        }

        .email-display {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #fff;
            margin-bottom: 1rem;
            display: block;
        }

        .click-hint {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: #666;
            letter-spacing: 2px;
        }

        /* Glitch Animation for text */
        .glitch-text:hover {
            animation: text-glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        @keyframes text-glitch {
            0% { transform: translate(0); text-shadow: none; }
            25% { transform: translate(-2px, 2px); text-shadow: 2px 0 var(--glitch-red); }
            50% { transform: translate(2px, -2px); text-shadow: -2px 0 var(--accent); }
            75% { transform: translate(-1px, -1px); text-shadow: 1px 1px var(--glitch-red); }
            100% { transform: translate(0); }
        }

        /* Feedback Toast */
        #toast {
            position: fixed;
            bottom: 30px;
            background: var(--accent);
            color: #000;
            padding: 10px 30px;
            font-family: 'Syncopate';
            font-weight: 700;
            font-size: 0.8rem;
            transform: translateY(100px);
            transition: 0.5s;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
        }

        #toast.show { transform: translateY(0); }

        @media (max-width: 600px) {
            .nav-links { display: none; }
            .email-card { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">TB078</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
                        <a href="contact.html" style="color: var(--accent);">Contact</a>
        </div>
    </nav>

    <main class="contact-container">
        <div class="hero">
            <h1 class="glitch-text">CONTACT</h1>
            <p class="status-line">ESTABLISHING SECURE CONNECTION...</p>
        </div>

        <div class="email-card" onclick="copyEmail()">
            <span class="email-display glitch-text">tantebep078@gmail.com</span>
            <p class="click-hint">[ KLIK OM TE KOPIËREN ]</p>
        </div>

        <p style="margin-top: 2rem; color: #444; font-size: 0.8rem; font-family: 'Space Mono';">
            RESPONSE TIME: < 24 HOURS // ENCRYPTED M-L1
        </p>
    </main>

    <div id="toast">EMAIL GEKOPIEERD</div>

    <script>
        function copyEmail() {
            const email = "tantebep078@gmail.com";
            navigator.clipboard.writeText(email).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            });
        }

        // Mouse move effect for background subtle glow
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
            document.querySelector('.email-card').style.transform = `translate(${moveX}px, ${moveY}px) translateY(0)`;
        });
    </script>
</body>
</html>
