<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanteBep078 | NIX.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap-grid.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff;
            --glitch-red: #ff003c;
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
        }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a {
            text-decoration: none;
            color: #aaa;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .nav-links a:hover { color: #fff; text-shadow: 0 0 10px var(--accent); }

        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 10%;
            text-align: center;
        }
        .hero h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(1.8rem, 7vw, 5rem); 
            margin-bottom: 0.5rem;
            position: relative;
            width: 100%;
        }

        .brand-text {
            font-family: 'Syncopate', sans-serif;
            font-size: 0.75rem;
            color: #fff;
            letter-spacing: 5px;
            margin-top: 1.5rem;
            padding: 10px 20px;
            border-top: 1px solid rgba(0, 242, 255, 0.3);
            border-bottom: 1px solid rgba(0, 242, 255, 0.3);
            opacity: 0.9;
            margin-bottom: 3rem;
        }

        .item-container {
            margin-bottom: 40px;
            text-align: center;
        }

        .flip-card {
            perspective: 1000px;
            height: 400px;
            margin: 0 auto;
            width: 100%;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card.active .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-front, .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .flip-back { transform: rotateY(180deg); }
        .flip-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: zoom-in;
        }

        .flip-overlay-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: #fff;
            color: #000;
            font-family: 'Syncopate';
            font-size: 0.55rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            transition: 0.3s;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Subtle indicator that it's an action button */
        .flip-overlay-btn::after {
            content: '⟳';
            font-size: 0.9rem;
            font-weight: bold;
        }

        .flip-overlay-btn:hover {
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transform: translateX(-50%) scale(1.05);
        }

        .order-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 40px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            font-family: 'Syncopate', sans-serif;
            font-size: 0.7rem;
            text-decoration: none;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .order-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        .lightbox {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* --- GLITCH FOOTER STYLES --- */
        footer {
            margin-top: 100px;
            padding: 60px 5%;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: linear-gradient(to bottom, transparent, #080808);
            position: relative;
            overflow: hidden;
        }

        footer::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 1px;
            background: var(--accent);
            opacity: 0.1;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }

        .footer-status {
            font-family: 'Syncopate', sans-serif;
            font-size: 0.6rem;
            color: var(--accent);
            letter-spacing: 3px;
            opacity: 0.6;
            text-transform: uppercase;
        }

        .footer-logo {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 10px;
            position: relative;
        }

        .glitch-text {
            position: relative;
            display: inline-block;
        }

        .glitch-text::before, .glitch-text::after {
            content: "NIX.";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            clip: rect(0, 0, 0, 0);
        }

        .glitch-text:hover::before {
            left: 2px;
            text-shadow: -2px 0 var(--glitch-red);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .footer-copy {
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 1px;
            margin-top: 20px;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 20px, 0); }
            20% { clip: rect(30px, 9999px, 40px, 0); }
            40% { clip: rect(50px, 9999px, 60px, 0); }
            60% { clip: rect(70px, 9999px, 80px, 0); }
            80% { clip: rect(90px, 9999px, 100px, 0); }
            100% { clip: rect(10px, 9999px, 20px, 0); }
        }

        @media (max-width: 768px) {
            .nav-links { display: flex; } 
            .hero { height: 50vh; padding-top: 60px; }
            .hero h1 { font-size: 1.6rem; } 
            .brand-text { font-size: 0.5rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Zoomed view">
    </div>

    <nav>
        <div class="logo">TB078</div>
        <div class="nav-links">
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <main class="hero">
        <h1>TanteBep078</h1>
        <p style="color: #666; letter-spacing: 3px;">PREMIUM QUALITY // 078 AREA</p>
        <div class="brand-text">
            DE EXCLUSIEVE BESTEMMING VOOR PREMIUM BRAND ITEMS
        </div>
    </main>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 item-container" style="margin-bottom: 60px;">
<div style="font-family: 'Syncopate', sans-serif; font-size: 0.85rem; margin-top: 20px; letter-spacing: 2px;">
                    <span style="color: var(--accent); font-weight: 700;">GROTE ZOMERACTIE:</span> PETJES NU VOOR MAAR €25
                </div>

                <div style="height: 680px; max-width: 384px; margin: 0 auto; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px; overflow: hidden;">
                    <img src="images/petjes/pet.jpg" alt="GROTE ZOMERACTIE - PETJES" onclick="openLightbox(this.src)" style="width: 100%; height: 100%; object-fit: cover; cursor: zoom-in;">
                </div>
                
                <a href="mailto:tantebep078@gmail.com?subject=Bestelling: Grote Zomeractie Petjes voor €25" class="order-btn" style="padding: 14px 60px; font-size: 0.75rem;">Bestellen</a>
            </div>
        </div>

        <div class="row">
            <script>
                const items = [
                    
                    {id: '7', name: 'Appelmoes', img: 'images/petjes/appel.jpg', back: 'images/petjes/appel2.jpg'},
                    {id: '8', name: 'Eigenlijk', img: 'images/petjes/eigenlijk.jpg', back: 'images/petjes/eigenlijk2.png'},
                    {id: '9', name: 'Mooi maken', img: 'images/petjes/mooi.png', back: 'images/petjes/mooi2.png'},
                    {id: '10', name: 'Tante Bep', img: 'images/petjes/tante.png', back: 'images/petjes/tante2.png'},
                    
                    // The original 6 items follow right below
                    {id: '1', name: 'BODYWARMER', img: 'images/nix1.jpg', back: 'images/nix1flip.jpg'},
                    {id: '2', name: 'HOODIE', img: 'images/nix2.jpg', back: 'images/nix2flip.jpg'},
                    {id: '3', name: 'UNDWEAR BLACK', img: 'images/nix3.jpg', back: 'images/nix3flip.jpg'},
                    {id: '4', name: 'UNDWEAR BLUE', img: 'images/nix4.jpg', back: 'images/nix4flip.jpg'},
                    {id: '5', name: 'UNDWEAR BLACK', img: 'images/nix5.jpg', back: 'images/nix5flip.jpg'},
                    {id: '6', name: 'UNDWEAR BLUE', img: 'images/nix6.jpg', back: 'images/nix6flip.jpg'}
                ];

                items.forEach(item => {
                    document.write(`
                        <div class="col-12 col-md-6 col-lg-4 item-container">
                            <div class="flip-card" id="card${item.id}">
                                <div class="flip-card-inner">
                                    <div class="flip-front">
                                        <img src="${item.img}" alt="${item.name}" onclick="openLightbox(this.src)">
                                        <button class="flip-overlay-btn" onclick="event.stopPropagation(); flip('card${item.id}')">INFO / ${item.name}</button>
                                    </div>
                                    <div class="flip-back">
                                        <img src="${item.back}" alt="${item.name} Back" onclick="openLightbox(this.src)">
                                        <button class="flip-overlay-btn" onclick="event.stopPropagation(); flip('card${item.id}')">BACK</button>
                                    </div>
                                </div>
                            </div>
                            <a href="mailto:tantebep078@gmail.com?subject=Bestelling: ${item.name}" class="order-btn">Bestellen</a>
                        </div>
                    `);
                });
            </script>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-status">// SYSTEM STATUS: ONLINE //</div>
            <div class="footer-logo"><span class="glitch-text">NIX.</span></div>
            <div class="footer-status">078 AREA // PREMIUM QUALITY ONLY</div>
            <div class="footer-copy">&copy; 2026 TANTEBEP078. ALL RIGHTS RESERVED.</div>
        </div>
    </footer>

    <script>
        function flip(id) {
            document.getElementById(id).classList.toggle('active');
        }

        function openLightbox(src) {
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lightbox-img');
            lbImg.src = src;
            lb.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            const title = document.querySelector('.hero h1');
            if(title && window.innerWidth > 600) title.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    </script>
</body>
</html>
