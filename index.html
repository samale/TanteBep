<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanteBep078 | NIX.</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff;
            --glitch-red: #ff003c;
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
        }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a {
            text-decoration: none;
            color: #aaa;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .nav-links a:hover { color: #fff; text-shadow: 0 0 10px var(--accent); }

        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 10%;
            text-align: center;
        }
        .hero h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(1.8rem, 7vw, 5rem); 
            margin-bottom: 0.5rem;
            position: relative;
            width: 100%;
        }

        .brand-text {
            font-family: 'Syncopate', sans-serif;
            font-size: 0.75rem;
            color: #fff;
            letter-spacing: 5px;
            margin-top: 1.5rem;
            padding: 10px 20px;
            border-top: 1px solid rgba(0, 242, 255, 0.3);
            border-bottom: 1px solid rgba(0, 242, 255, 0.3);
            opacity: 0.9;
        }

        .flip-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            padding: 0 10% 5% 10%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .flip-card {
            perspective: 1000px;
            height: 400px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card.active .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-front, .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .flip-back { transform: rotateY(180deg); }
        .flip-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: zoom-in; /* Indicates the image is clickable for zoom */
        }
        .flip-overlay-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: #fff;
            color: #000;
            font-family: 'Syncopate';
            font-size: 0.7rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            transition: 0.3s;
            z-index: 5;
        }
        .flip-overlay-btn:hover {
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        /* LIGHTBOX STYLES */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
        }
        .close-zoom {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: 'Syncopate';
            color: var(--accent);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {
            .nav-links { display: flex; } 
            .hero { height: 50vh; padding-top: 60px; }
            .hero h1 { font-size: 1.6rem; letter-spacing: 1px; } 
            .brand-text { font-size: 0.5rem; letter-spacing: 2px; padding: 10px 5px; }
            .flip-grid { grid-template-columns: 1fr; padding: 5%; }
        }
    </style>
</head>
<body>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-zoom">[ CLOSE ]</span>
        <img id="lightbox-img" src="" alt="Zoomed view">
    </div>

    <nav>
        <div class="logo">TB078</div>
        <div class="nav-links">
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <main class="hero">
        <h1>TanteBep078</h1>
        <p style="color: #666; letter-spacing: 3px;">PREMIUM QUALITY // 078 AREA</p>
        <div class="brand-text">
            DE EXCLUSIEVE BESTEMMING VOOR PREMIUM BRAND ITEMS
        </div>
    </main>

    <section class="flip-grid">
        <div class="flip-card" id="card1">
            <div class="flip-card-inner">
                <div class="flip-front">
                    <img src="images/nix1.jpg" alt="Front 1" onclick="openLightbox(this.src)">
                    <button class="flip-overlay-btn" onclick="flip('card1')">BODYWARMER</button>
                </div>
                <div class="flip-back">
                    <img src="images/nix1flip.jpg" alt="Back 1" onclick="openLightbox(this.src)">
                    <button class="flip-overlay-btn" onclick="flip('card1')">TERUG</button>
                </div>
            </div>
        </div>
        <div class="flip-card" id="card2">
            <div class="flip-card-inner">
                <div class="flip-front">
                    <img src="images/nix2.jpg" alt="Front 2" onclick="openLightbox(this.src)">
                    <button class="flip-overlay-btn" onclick="flip('card2')">HOODIE</button>
                </div>
                <div class="flip-back">
                    <img src="images/nix2flip.jpg" alt="Back 2" onclick="openLightbox(this.src)">
                    <button class="flip-overlay-btn" onclick="flip('card2')">TERUG</button>
                </div>
            </div>
        </div>
        <div class="flip-card" id="card3">
            <div class="flip-card-inner">
                <div class="flip-front">
                    <img src="images/nix3.jpg" alt="Front 3" onclick="openLightbox(this.src)">
                    <button class="flip-overlay-btn" onclick="flip('card3')">BIKINI</button>
                </div>
                <div class="flip-back">
                    <img src="images/nix3flip.jpg" alt="Back 3" onclick="openLightbox(this.src)">
                    <button class="flip-overlay-btn" onclick="flip('card3')">TERUG</button>
                </div>
            </div>
        </div>
        <div class="flip-card" id="card4">
            <div class="flip-card-inner">
                <div class="flip-front">
                    <img src="images/nix4.jpg" alt="Front 4" onclick="openLightbox(this.src)">
                    <button class="flip-overlay-btn" onclick="flip('card4')">LEGGING</button>
                </div>
                <div class="flip-back">
                    <img src="images/nix4flip.jpg" alt="Back 4" onclick="openLightbox(this.src)">
                    <button class="flip-overlay-btn" onclick="flip('card4')">TERUG</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Flip function
        function flip(id) {
            document.getElementById(id).classList.toggle('active');
        }

        // Lightbox functions
        function openLightbox(src) {
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lightbox-img');
            lbImg.src = src;
            lb.classList.add('active');
            document.body.style.overflow = 'hidden'; // Stop scrolling when zoomed
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.remove('active');
            document.body.style.overflow = 'auto'; // Restore scrolling
        }

        // Mousemove effect
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            const title = document.querySelector('.hero h1');
            if(title && window.innerWidth > 600) title.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    </script>
</body>
</html>
